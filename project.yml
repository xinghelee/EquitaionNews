name: EQNews
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  EQNews:
    type: application
    platform: iOS
    sources: [EQNews]
    info:
      path: EQNews/Info.plist
      properties:
        CFBundleDisplayName: 方程式新闻
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.xinghelee.eqnews
            CFBundleURLSchemes: [eqnews]
    dependencies:
      - target: EQNewsWidgets
      - target: EQNewsWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinghelee.eqnews
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  EQNewsWidgets:
    type: app-extension
    platform: iOS
    sources: [EQNewsWidgets, Shared]
    info:
      path: EQNewsWidgets/Info.plist
      properties:
        CFBundleDisplayName: 方程式新闻
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinghelee.eqnews.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

  EQNewsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources: [EQNewsWatch, Shared]
    info:
      path: EQNewsWatch/Info.plist
      properties:
        CFBundleDisplayName: 方程式新闻
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.xinghelee.eqnews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinghelee.eqnews.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
